<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRE & Drawdown Calculator</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for parsing JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts for Graphing -->
    <script src="https://unpkg.com/prop-types@15.7.2/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

    <style>
        body { background-color: #f3f4f6; }
        input[type="range"] { accent-color: #3b82f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;

        function FireCalculator() {
            // Core Inputs
            const [corpus, setCorpus] = useState(20000000);
            const [monthlyPayout, setMonthlyPayout] = useState(90000);
            const [inflation, setInflation] = useState(6.0);
            const [years, setYears] = useState(40);

            // Allocations
            const [eqAlloc, setEqAlloc] = useState(50);
            const [debtAlloc, setDebtAlloc] = useState(40);
            
            // Returns
            const [eqReturn, setEqReturn] = useState(11.5);
            const [debtReturn, setDebtReturn] = useState(7.0);
            const [cashReturn, setCashReturn] = useState(5.0);

            // Auto-calculate cash allocation
            const cashAlloc = Math.max(0, 100 - eqAlloc - debtAlloc);
            const normalizedEq = (eqAlloc / (eqAlloc + debtAlloc + cashAlloc)) || 0;
            const normalizedDebt = (debtAlloc / (eqAlloc + debtAlloc + cashAlloc)) || 0;
            const normalizedCash = (cashAlloc / (eqAlloc + debtAlloc + cashAlloc)) || 0;

            const blendedReturn = (
                (normalizedEq * eqReturn) + 
                (normalizedDebt * debtReturn) + 
                (normalizedCash * cashReturn)
            ).toFixed(2);

            const simulationData = useMemo(() => {
                let balance = corpus;
                let currentMonthly = monthlyPayout;
                const data = [];
                const monthlyRate = blendedReturn / 100 / 12;

                for (let y = 0; y <= years; y++) {
                    data.push({
                        year: `Year ${y}`,
                        balance: Math.max(0, Math.round(balance)),
                        withdrawal: y === 0 ? 0 : Math.round(currentMonthly * 12)
                    });

                    if (y === years) break;

                    for (let m = 0; m < 12; m++) {
                        balance -= currentMonthly;
                        if (balance < 0) {
                            balance = 0;
                            break;
                        }
                        balance *= (1 + monthlyRate);
                    }
                    currentMonthly *= (1 + inflation / 100);
                }
                return data;
            }, [corpus, monthlyPayout, inflation, years, blendedReturn]);

            const finalBalance = simulationData[simulationData.length - 1].balance;
            const depletedYear = simulationData.findIndex(d => d.balance === 0);
            const status = depletedYear !== -1 ? `Depleted in Year ${depletedYear}` : 'Portfolio Survived';
            
            const formatINR = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val);

            return (
                <div className="max-w-6xl mx-auto p-4 py-8">
                    <h1 className="text-3xl font-bold text-gray-800 mb-6 text-center">Interactive FIRE & Drawdown Calculator</h1>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Controls Panel */}
                        <div className="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h2 className="text-xl font-semibold mb-4 border-b pb-2">Portfolio Variables</h2>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Initial Corpus: {formatINR(corpus)}</label>
                                    <input type="range" min="5000000" max="100000000" step="1000000" value={corpus} onChange={e => setCorpus(Number(e.target.value))} className="w-full mt-1" />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Year 1 Monthly Payout: {formatINR(monthlyPayout)}</label>
                                    <input type="range" min="20000" max="500000" step="5000" value={monthlyPayout} onChange={e => setMonthlyPayout(Number(e.target.value))} className="w-full mt-1" />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Inflation Rate: {inflation}%</label>
                                    <input type="range" min="2" max="12" step="0.5" value={inflation} onChange={e => setInflation(Number(e.target.value))} className="w-full mt-1" />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Simulation Years: {years}</label>
                                    <input type="range" min="10" max="60" step="1" value={years} onChange={e => setYears(Number(e.target.value))} className="w-full mt-1" />
                                </div>

                                <h2 className="text-xl font-semibold mt-6 mb-2 border-b pb-2">Asset Allocation</h2>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 text-blue-600">Equity Allocation: {Math.round(normalizedEq * 100)}% (Return: {eqReturn}%)</label>
                                    <input type="range" min="0" max="100" value={eqAlloc} onChange={e => setEqAlloc(Number(e.target.value))} className="w-full mt-1" />
                                    <input type="range" min="5" max="20" step="0.5" value={eqReturn} onChange={e => setEqReturn(Number(e.target.value))} className="w-full mt-1" />
                                </div>

                                <div className="mt-2">
                                    <label className="block text-sm font-medium text-gray-700 text-green-600">Debt/FD Allocation: {Math.round(normalizedDebt * 100)}% (Return: {debtReturn}%)</label>
                                    <input type="range" min="0" max="100" value={debtAlloc} onChange={e => setDebtAlloc(Number(e.target.value))} className="w-full mt-1" />
                                    <input type="range" min="4" max="12" step="0.5" value={debtReturn} onChange={e => setDebtReturn(Number(e.target.value))} className="w-full mt-1" />
                                </div>
                                
                                <div className="mt-2 text-sm text-gray-600 bg-gray-50 p-3 rounded border">
                                    Cash Allocation (Auto): <b>{Math.round(normalizedCash * 100)}%</b> @ {cashReturn}% return
                                </div>
                            </div>
                        </div>

                        {/* Visualization Panel */}
                        <div className="lg:col-span-2 space-y-6">
                            
                            {/* Summary Cards */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                                    <p className="text-sm text-gray-500 font-medium">Blended Portfolio Return</p>
                                    <p className="text-2xl font-bold text-gray-800">{blendedReturn}%</p>
                                </div>
                                <div className={`bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center ${depletedYear !== -1 ? 'border-red-400 bg-red-50' : 'border-green-400 bg-green-50'}`}>
                                    <p className="text-sm text-gray-700 font-medium">Simulation Status</p>
                                    <p className={`text-2xl font-bold ${depletedYear !== -1 ? 'text-red-600' : 'text-green-600'}`}>{status}</p>
                                </div>
                                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                                    <p className="text-sm text-gray-500 font-medium">Terminal Wealth (Year {years})</p>
                                    <p className="text-xl font-bold text-gray-800">{formatINR(finalBalance)}</p>
                                </div>
                            </div>

                            {/* Chart */}
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-[500px]">
                                <h3 className="text-lg font-semibold mb-4 text-center">Portfolio Balance Over {years} Years</h3>
                                <ResponsiveContainer width="100%" height="90%">
                                    <LineChart data={simulationData} margin={{ top: 5, right: 20, bottom: 5, left: 20 }}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="year" minTickGap={20} />
                                        <YAxis tickFormatter={(value) => `₹${(value / 10000000).toFixed(1)}Cr`} width={80} />
                                        <Tooltip formatter={(value, name) => [formatINR(value), name === 'balance' ? 'Portfolio Balance' : 'Annual Withdrawal']} />
                                        <Legend />
                                        <Line type="monotone" dataKey="balance" stroke="#3b82f6" strokeWidth={3} dot={false} name="Portfolio Balance" />
                                        <Line type="monotone" dataKey="withdrawal" stroke="#ef4444" strokeWidth={2} dot={false} name="Annual Withdrawal (Inflation Adjusted)" />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FireCalculator />);
    </script>
</body>
</html>
